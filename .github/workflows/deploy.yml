name: Tests y despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. cancel-in-progress en false para no cortar una
# publicacion a medias si haces dos push seguidos.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        # --locked: si el Cargo.lock no cuadra con el Cargo.toml, falla aqui
        # con un mensaje claro en vez de resolver versiones nuevas por su
        # cuenta y romperse mas adelante al compilar a wasm.
        run: cargo test --lib --locked

  build:
    name: Compilar a WebAssembly
    # Solo se publica desde main, no desde pull requests.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Va primero a proposito: si Pages no esta configurado, falla en
      # segundos en vez de despues de compilar medio Rust.
      # enablement: true lo activa solo la primera vez.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Compilar
        # --public-url sale del nombre del repo, asi las rutas funcionan en
        # https://usuario.github.io/nombre-del-repo/ sin tocar nada a mano.
        run: trunk build --release --public-url "/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publicar en GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
