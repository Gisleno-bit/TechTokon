[package]
name = "tokon-tech-log"
version = "0.1.0"
edition = "2021"
description = "Registro de tech para MARVEL Tokon: Fighting Souls"
license = "MIT"

# La logica pura (roster, notacion, CSV) vive en la lib y se puede testear
# sin tener el toolchain de WebAssembly instalado: `cargo test`.
[lib]
name = "tokon_tech_log"
path = "src/lib.rs"

[[bin]]
name = "tokon-tech-log"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Todo lo que toca el navegador solo se compila para wasm32. Asi `cargo test`
# en Windows no necesita descargar ni compilar Yew.
#
# Las versiones van fijadas con "=" a proposito: este conjunto esta probado y
# funciona junto. Yew 0.21 no se lleva bien con las versiones mas nuevas de
# wasm-bindgen/web-sys. Si algun dia quieres actualizar, sube todo el bloque a
# la vez y comprueba que sigue compilando antes de publicar.
[target.'cfg(target_arch = "wasm32")'.dependencies]
yew = { version = "=0.21.0", features = ["csr"] }
wasm-bindgen = "=0.2.92"
wasm-bindgen-futures = "=0.4.42"
js-sys = "=0.3.69"
gloo-storage = "=0.3.0"
gloo-file = { version = "=0.3.0", features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "=0.3.69"
features = [
    "Blob",
    "Document",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Node",
    "Url",
    "Window",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
