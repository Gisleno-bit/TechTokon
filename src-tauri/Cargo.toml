[package]
name = "tokon-tech-log-desktop"
version = "0.1.0"
edition = "2021"
description = "Ventana de escritorio para Tokon Tech Log"
license = "MIT"

# Workspace propio: evita que cargo intente meter esta carpeta dentro del
# paquete de la raiz y falle con "package believes it's in a workspace".
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
